name: CI

on:
  push:
    branches:
      - dev/**
      - stage/**
      - prod/**
      - master
  pull_request:
    branches:
      - master

jobs:
  robot-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install Robot Framework
        run: |
          python -m pip install --upgrade pip
          pip install robotframework
      - name: Run Robot logic suite
        env:
          GODOT_BIN: ${{ github.workspace }}/tools/godot/godot4
        run: |
          robot tests/robot/logic_tests.robot
